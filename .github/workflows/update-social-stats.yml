name: Update social stats

on:
  schedule:
    - cron: "0 3 * * 1" # Run once per week on Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: site-rebuild

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Update social totals
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          npm run update:social || true

      - name: Commit updated social stats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin site-rebuild || true
          git add data/social-totals.json data/instagram-stats.json data/tiktok-stats.json
          if git diff --staged --quiet; then
            echo "No social stats changes to commit"
          else
            git commit -m "Update social stats"
            git push origin HEAD:site-rebuild
          fi
