name: Update social stats

on:
  schedule:
    - cron: "0 3 * * *" # Run once per day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: site-rebuild

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch Instagram and TikTok stats via Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          npm run fetch:instagram || true
          npm run fetch:tiktok || true

      - name: Commit updated social stats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram-stats.json data/tiktok-stats.json
          if git diff --staged --quiet; then
            echo "No social stats changes to commit"
          else
            git commit -m "Update social stats from Apify"
            git push
          fi
