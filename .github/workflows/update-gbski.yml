name: Update GBSki race data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch GBSki debug HTML
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/update-gbski.mjs

      - name: Upload GBSki debug HTML
        uses: actions/upload-artifact@v4
        with:
          name: gbski-debug
          path: gbski-debug.html
          if-no-files-found: error
